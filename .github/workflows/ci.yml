name: CI and release certification

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - working-directory: python
        run: python -m pip install --upgrade pip 'setuptools>=84.1.0' && python -m pip install -e '.[dev]'
      - working-directory: python
        run: python -m pytest tests -q --tb=short

  quality-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - working-directory: python
        run: python -m pip install --upgrade pip 'setuptools>=84.1.0' && python -m pip install -e '.[dev]'
      - name: Selected Ruff correctness rules
        working-directory: python
        run: ruff check purplesploit tests
      - name: Format S19-S23 owned surfaces
        working-directory: python
        run: >-
          ruff format --check
          purplesploit/core/{store,secrets,evidence,recovery,policy,remote,output_security,support}.py
          purplesploit/services purplesploit/plugins/{manager,security}.py
          purplesploit/distributed/security.py purplesploit/ai/advisory.py
          purplesploit/reporting/{generator,pdf,xlsx}.py
          scripts/normalize_release_artifacts.py
      - name: Type-check security contracts
        working-directory: python
        run: >-
          mypy --follow-imports=skip --check-untyped-defs
          purplesploit/services/security.py purplesploit/core/policy.py
          purplesploit/distributed/security.py purplesploit/plugins/security.py
      - name: Static security policy
        working-directory: python
        run: >-
          bandit -q -r purplesploit/core purplesploit/services purplesploit/plugins
          purplesploit/distributed purplesploit/integrations purplesploit/ai
          purplesploit/reporting -ll -s B404,B603,B607,B608
      - name: Dependency audit
        working-directory: python
        run: pip-audit --strict --skip-editable .
      - name: Repository secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release policy checks
        working-directory: python
        run: python scripts/certify_release.py --source-tree ..
      - name: Recovery rehearsal
        working-directory: python
        run: python scripts/recovery_rehearsal.py

  build:
    needs: [test, quality-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: python
        run: python -m pip install --upgrade pip 'setuptools>=84.1.0' build twine cyclonedx-bom
      - name: Reproducible build
        working-directory: python
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m build --outdir dist-a
          python -m build --outdir dist-b
          python scripts/normalize_release_artifacts.py dist-a/*.tar.gz
          python scripts/normalize_release_artifacts.py dist-b/*.tar.gz
          for artifact in dist-a/*; do cmp "$artifact" "dist-b/$(basename "$artifact")"; done
          mkdir dist
          cp dist-a/* dist/
          twine check dist/*
      - name: SBOM and provenance
        working-directory: python
        run: |
          cyclonedx-py environment --output-format JSON -o dist/purplesploit-7.0.0.sbom.json
          python scripts/release_manifest.py dist dist/purplesploit-7.0.0.provenance.json
          python scripts/certify_release.py --source-tree .. --dist dist
      - name: Keyless-sign release-tag artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: purplesploit-dist
          path: python/dist/
          if-no-files-found: error
